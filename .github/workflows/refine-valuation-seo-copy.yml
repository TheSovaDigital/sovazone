name: Refine Valuation AI SEO copy
# retry after tightening the RU terminology guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-valuation-seo-copy.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Polish RU terminology
        run: python .github/scripts/polish_valuation_ru_language.py
      - name: Validate valuation engines and pages
        run: |
          node --check tools/username-value.js
          node --check api/username-value.js
          node --check api/telegram-username-value.js
          node .github/scripts/test_username_valuation_v38.mjs
          node .github/scripts/test_telegram_valuation_v1.mjs
          grep -q '<span class="uv-title-line">Узнать стоимость</span> <span class="uv-title-line">никнейма</span>' tools/username-value.html
          grep -q 'Узнать стоимость никнейма Instagram' tools/instagram-username-value.html
          grep -q 'Узнать стоимость никнейма TikTok' tools/tiktok-username-value.html
          grep -q 'Узнать стоимость никнейма Telegram' tools/telegram-username-value.html
          grep -q 'Как разместить объявление' tools/username-value.js
          for f in tools/instagram-username-value.html tools/tiktok-username-value.html tools/telegram-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html en/tools/telegram-username-value.html; do grep -q 'username-value.js?v=18' "$f"; done
      - name: Commit terminology polish
        run: |
          git config user.name 'SovaDigital'
          git config user.email 'thesovaz@gmail.com'
          git add tools/username-value.html tools/instagram-username-value.html tools/tiktok-username-value.html tools/telegram-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html en/tools/telegram-username-value.html tools/username-value.js
          git diff --cached --quiet && exit 0
          git commit -m 'Polish Russian Valuation AI terminology'
          git push
