name: Verify public SovaZone menu with fresh and cached old CSS
on:
  push:
    branches: [audit-dropdown-cached-css-20261109]
    paths: ['.github/workflows/test-dropdown-stale-css.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Chrome
        shell: bash
        run: |
          node --check script.js
          node --check en/script.js
          which google-chrome
          npm --prefix /tmp/navtest install puppeteer-core@24.25.0 --no-save --no-audit --no-fund
      - name: Check desktop/mobile layout with normal and deliberately stale styles.css
        shell: bash
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/nav-server.log 2>&1 &
          sleep 1
          cat >/tmp/test.cjs <<'JS'
          const puppeteer=require('/tmp/navtest/node_modules/puppeteer-core');
          const fs=require('fs');
          const fullCSS=fs.readFileSync('styles.css','utf8');
          const oldCSS=fullCSS.slice(0,fullCSS.indexOf('/* SovaZone fast icon dropdowns:'));
          if(oldCSS.length<20000)throw Error('Old CSS extraction failed');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            let tests=0;
            const assert=(x,m)=>{if(!x)throw Error('FAIL '+m);console.log('PASS '+m);tests++};
            try{
              for(const variant of ['normal','stale']){
                for(const lang of ['ru','en']){
                  const page=await browser.newPage();
                  await page.setViewport({width:1440,height:900});
                  if(variant==='stale'){
                    await page.setRequestInterception(true);
                    page.on('request',req=>req.url().endsWith('/styles.css')?req.respond({status:200,contentType:'text/css',body:oldCSS}):req.continue());
                  }
                  await page.goto('https://sovazone.com/'+(lang==='en'?'en/':'')+'?live-nav-cache=20261109',{waitUntil:'domcontentloaded',timeout:30000});
                  await page.waitForSelector('.sz-nav-panel',{timeout:10000});
                  const initial=await page.evaluate(()=>{
                    const h=document.querySelector('.sz-header').getBoundingClientRect();
                    const p=document.querySelector('.sz-nav-panel'),c=getComputedStyle(p),r=p.getBoundingClientRect();
                    return {headerHeight:h.height,panelPos:c.position,panelVisibility:c.visibility,menuWidth:r.width,panelOpacity:c.opacity,cssInFragment:document.querySelector('.sz-header style')?.textContent.includes('Inline critical nav rules')};
                  });
                  assert(initial.headerHeight<90&&initial.headerHeight>30,variant+' '+lang+' stable header '+initial.headerHeight);
                  assert(initial.panelPos==='absolute'&&initial.panelVisibility==='hidden'&&initial.menuWidth>=300,variant+' '+lang+' hidden absolute dropdown');
                  assert(initial.cssInFragment,variant+' '+lang+' critical CSS embedded');
                  const trigger=(await page.$$('[data-nav-menu]'))[0];
                  await trigger.hover();
                  await page.waitForFunction(()=>getComputedStyle(document.querySelector('.sz-nav-panel')).visibility==='visible');
                  assert(await page.$eval('.sz-nav-panel',p=>getComputedStyle(p).position==='absolute'),variant+' '+lang+' hover panel overlay');
                  const alignment=await page.evaluate(()=>{
                    const h=document.querySelector('.sz-header').getBoundingClientRect(),p=document.querySelector('.sz-nav-panel').getBoundingClientRect();return {header:h.height,panelY:p.y,headBottom:h.bottom};
                  });
                  assert(alignment.panelY>=alignment.headBottom-15,variant+' '+lang+' dropdown anchors below bar');
                  await page.hover('.sz-nav-panel .sz-nav-card');
                  assert(await page.$eval('.sz-nav-panel',p=>getComputedStyle(p).visibility==='visible'),variant+' '+lang+' cursor moves from trigger into dropdown');

                  await page.keyboard.press('Escape');
                  await page.mouse.move(10,800);
                  await page.setViewport({width:390,height:844});
                  await page.reload({waitUntil:'domcontentloaded'});
                  await page.waitForSelector('.sz-header__burger',{timeout:8000});
                  const mobile=await page.evaluate(()=>{
                    const h=document.querySelector('.sz-header').getBoundingClientRect(),burger=getComputedStyle(document.querySelector('.sz-header__burger')),nav=getComputedStyle(document.querySelector('.sz-header__nav'));
                    return {h:h.height,burger:burger.display,nav:nav.display,scroll:document.documentElement.scrollWidth,innerWidth:innerWidth};
                  });
                  assert(mobile.h<88&&mobile.nav==='none',variant+' '+lang+' mobile nav fits');
                  await page.click('.sz-header__burger');
                  await new Promise(r=>setTimeout(r,230));
                  const group=(await page.$$('.sz-side__dropdown'))[1];
                  await (await group.$('summary')).click();
                  assert(await group.evaluate(el=>el.open),variant+' '+lang+' mobile accordion opens');
                  assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2),variant+' '+lang+' no mobile horizontal overflow');
                  await page.close();
                }
              }
              console.log('PASS ALL '+tests+' BROWSER ASSERTIONS INCLUDING OLD STYLESHEET');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/test.cjs
