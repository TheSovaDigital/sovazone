name: Username valuation final page audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/username-pages-final-audit.yml'

permissions:
  contents: write

jobs:
  audit-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Apply final page audit patch
        run: python .github/scripts/patch_username_pages_final_audit.py

      - name: Validate code and permanent valuation regressions
        run: |
          node --check tools/username-value.js
          node .github/scripts/test_username_valuation_v38.mjs
          node .github/scripts/test_telegram_valuation_v1.mjs

      - name: Validate page consistency and SEO
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            tools/instagram-username-value.html
            tools/tiktok-username-value.html
            tools/telegram-username-value.html
            en/tools/instagram-username-value.html
            en/tools/tiktok-username-value.html
            en/tools/telegram-username-value.html
          )
          for f in "${pages[@]}"; do
            grep -q 'username-value.css?v=4' "$f"
            grep -q 'username-value.js?v=15' "$f"
            grep -q 'hreflang="x-default"' "$f"
            grep -q 'aria-current="page"' "$f"
            grep -q 'Telegram' "$f"
          done
          grep -q 'maxlength="30"' tools/instagram-username-value.html
          grep -q 'maxlength="30"' tools/tiktok-username-value.html
          grep -q 'maxlength="32"' tools/telegram-username-value.html
          grep -q 'maxlength="30"' en/tools/instagram-username-value.html
          grep -q 'maxlength="30"' en/tools/tiktok-username-value.html
          grep -q 'maxlength="32"' en/tools/telegram-username-value.html
          grep -q 'Двухсимвольные TikTok username' tools/tiktok-username-value.html
          ! grep -q 'официального прайс-листа' tools/instagram-username-value.html
          ! grep -q 'официального прайс-листа' tools/tiktok-username-value.html
          grep -q 'uv-sell-callout' tools/instagram-username-value.html
          grep -q 'uv-sell-callout' en/tools/instagram-username-value.html
          ! grep -q 'uv-sell-callout' tools/tiktok-username-value.html
          ! grep -q 'uv-sell-callout' tools/telegram-username-value.html
          ! grep -q 'uv-sell-callout' en/tools/tiktok-username-value.html
          ! grep -q 'uv-sell-callout' en/tools/telegram-username-value.html
          grep -q 'Telegram' tools/username-value.html
          grep -q 'Telegram' en/tools/username-value.html
          grep -q 'username-value.css?v=4' tools/username-value.html
          grep -q 'username-value.css?v=4' en/tools/username-value.html
          grep -q 'Instagram username' tools/username-value.html
          grep -q 'Instagram username' en/tools/username-value.html
          ! grep -q 'tools/username-value.js' tools/username-value.html
          ! grep -q 'tools/username-value.js' en/tools/username-value.html
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' tools/username-value.css
          grep -q "specialCase==='invalid_username'" tools/username-value.js
          grep -q "platform!=='instagram'" tools/username-value.js

      - name: Commit audited production files
        run: |
          git config user.name 'SovaDigital'
          git config user.email 'thesovaz@gmail.com'
          git add \
            tools/username-value.css \
            tools/username-value.js \
            tools/username-value.html \
            tools/instagram-username-value.html \
            tools/tiktok-username-value.html \
            tools/telegram-username-value.html \
            en/tools/username-value.html \
            en/tools/instagram-username-value.html \
            en/tools/tiktok-username-value.html \
            en/tools/telegram-username-value.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize username valuation pages and SEO'
          git push

      - name: Wait for live static pages
        shell: bash
        run: |
          set -euo pipefail
          target='https://sovazone.com/tools/username-value'
          for i in {1..18}; do
            if curl -fsSL --max-time 20 "$target" | grep -q 'Открыть оценку Telegram'; then
              echo 'Live pages updated'
              exit 0
            fi
            echo "Waiting for static deployment ($i/18)..."
            sleep 10
          done
          echo 'Static deployment did not update in time'
          exit 1

      - name: Verify live RU and EN routes
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://sovazone.com/tools/username-value'
            'https://sovazone.com/tools/instagram-username-value'
            'https://sovazone.com/tools/tiktok-username-value'
            'https://sovazone.com/tools/telegram-username-value'
            'https://sovazone.com/en/tools/username-value'
            'https://sovazone.com/en/tools/instagram-username-value'
            'https://sovazone.com/en/tools/tiktok-username-value'
            'https://sovazone.com/en/tools/telegram-username-value'
          )
          for url in "${urls[@]}"; do
            body="$(curl -fsSL --max-time 20 "$url")"
            grep -q 'SovaZone' <<<"$body"
            grep -q 'Telegram' <<<"$body"
            echo "OK $url"
          done
          css="$(curl -fsSL --max-time 20 'https://sovazone.com/tools/username-value.css?v=4')"
          grep -q 'repeat(3,minmax(0,1fr))' <<<"$css"
          js="$(curl -fsSL --max-time 20 'https://sovazone.com/tools/username-value.js?v=15')"
          grep -q "specialCase==='invalid_username'" <<<"$js"
          echo 'PASS live RU/EN page audit'
