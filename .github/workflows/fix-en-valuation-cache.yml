name: Fix EN valuation cache version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-en-valuation-cache.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add cache version and remove temporary workflow
        run: |
          set -e
          for f in en/tools/instagram-username-value.html en/tools/tiktok-username-value.html; do
            sed -Ei 's#src="/tools/username-value\.js"#src="/tools/username-value.js?v=13"#g' "$f"
          done
          git rm .github/workflows/fix-en-valuation-cache.yml
          git config user.name "SovaDigital"
          git config user.email "thesovaz@gmail.com"
          git add en/tools/instagram-username-value.html en/tools/tiktok-username-value.html
          git commit -m "Align EN valuation cache version"
          git push origin HEAD:main
