name: Valuation v3.4 numeric calibration

on:
  push:
    paths:
      - '.github/workflows/valuation-v33-small-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply numeric-only patch
        run: python .github/scripts/patch_numeric_v34.py

      - name: Validate backend and frontend syntax
        run: |
          node --check api/username-value.js
          node --check tools/username-value.js

      - name: Run numeric regression tests
        run: node .github/scripts/test_numeric_v34.mjs

      - name: Commit numeric calibration
        run: |
          git config user.name "SovaDigital"
          git config user.email "thesovaz@gmail.com"
          git add api/username-value.js tools/username-value.js tools/instagram-username-value.html tools/tiktok-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html
          git commit -m "Refine three-digit numeric valuation ranges"
          git push origin HEAD:main
