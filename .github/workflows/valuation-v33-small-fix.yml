name: Valuation v3.6 semantic calibration

# v3.6 guarded retry after structural test version bump
on:
  push:
    paths:
      - '.github/workflows/valuation-v33-small-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply semantic-only patch
        run: python .github/scripts/patch_semantic_v36.py

      - name: Validate backend and frontend syntax
        run: |
          node --check api/username-value.js
          node --check tools/username-value.js

      - name: Run existing structural regression tests
        run: node .github/scripts/test_twochar_v35.mjs

      - name: Commit semantic calibration
        run: |
          git config user.name "SovaDigital"
          git config user.email "thesovaz@gmail.com"
          git add api/username-value.js tools/username-value.js tools/instagram-username-value.html tools/tiktok-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html
          git commit -m "Calibrate semantic valuation relationships v3.6"
          git push origin HEAD:main
