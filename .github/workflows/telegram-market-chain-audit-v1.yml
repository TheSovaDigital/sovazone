name: Telegram market chain audit v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-market-chain-audit-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download source sales audit
        run: gh run download 33952202680 -n sovausername-audit-v1 -D audit-output
      - name: Build cleaned market layer
        run: python scripts/build_telegram_market_layer.py audit-output/sales.jsonl --out-dir telegram-market-v1
      - name: Verify high-price NFT transfer cycles
        run: python scripts/verify_telegram_transfer_cycles.py telegram-market-v1/telegram-market-chain-queue-v1.csv --out telegram-market-v1/telegram-transfer-risk-v1.json
      - name: Print audit summary
        run: |
          python - <<'PY'
          import json
          s=json.load(open('telegram-market-v1/telegram-market-summary-v1.json'))
          c=json.load(open('telegram-market-v1/telegram-transfer-risk-v1.json'))
          print('CLEANING_CLASSES',s['class_counts'])
          print('CHAIN_QUEUE',s['chain_verification_queue_count'])
          print('CHAIN_STATUS',c['status_counts'])
          print('CHAIN_RISK',c['risk_counts'])
          print('TOP_RESULTS')
          for r in c['results'][:25]:
              print(r['username'],r['sale_price_ton'],r['chain_wash_risk'],r['chain_status'],r['transfer_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-market-chain-audit-v1
          path: telegram-market-v1/
          retention-days: 30
