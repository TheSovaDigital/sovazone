name: Verify published matte SovaZone navigation in browser
on:
  push:
    branches: [audit-matte-nav-mobile-20261109]
    paths: ['.github/workflows/audit-matte-navigation.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install headless Chrome driver
        run: |
          node --check script.js
          node --check en/script.js
          which google-chrome
          npm --prefix /tmp/matte-test install puppeteer-core@24.25.0 --no-save --no-audit --no-fund
      - name: Test locale variants and cached old styles
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 1
          cat >/tmp/audit.cjs <<'JS'
          const fs=require('fs');
          const puppeteer=require('/tmp/matte-test/node_modules/puppeteer-core');
          const css=fs.readFileSync('styles.css','utf8');
          const oldCss=css.slice(0,css.indexOf('/* SovaZone fast icon dropdowns:'));
          if(oldCss.length<20000)throw new Error('stale CSS fixture invalid');
          const check=(ok,msg)=>{if(!ok)throw new Error('FAIL '+msg);console.log('PASS '+msg);checks++};
          let checks=0;
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const variant of ['fresh','cached']){
                for(const lang of ['ru','en']){
                  const page=await browser.newPage();
                  await page.setViewport({width:1440,height:900});
                  if(variant==='cached'){
                    await page.setRequestInterception(true);
                    page.on('request',req=>req.url().endsWith('/styles.css')?req.respond({status:200,contentType:'text/css',body:oldCss}):req.continue());
                  }
                  const prefix=lang==='en'?'/en':'';
                  await page.goto('https://sovazone.com/'+(lang==='en'?'en/':'')+'?audit=matte20261109',{waitUntil:'domcontentloaded',timeout:30000});
                  await page.waitForSelector('.sz-nav-item');
                  const desktop=await page.evaluate(pref=>{
                    const nav=document.querySelector('.sz-header__nav');
                    const panel=document.querySelector('.sz-nav-panel');
                    const tik=Array.from(document.querySelectorAll('.sz-nav-card')).find(a=>a.href.endsWith('/tiktok-username-value'));
                    const telegram=Array.from(document.querySelectorAll('.sz-nav-card')).find(a=>a.href.endsWith('/telegram-username-value'));
                    return {a:nav.innerText.indexOf(pref+'/usernames'),html:nav.innerText,navHtml:nav.innerHTML,panelPosition:getComputedStyle(panel).position,panelColor:getComputedStyle(panel).backgroundColor,panelVisible:getComputedStyle(panel).visibility,headerHeight:document.querySelector('.sz-header').getBoundingClientRect().height,tikBrand:!!tik?.querySelector('path[fill="currentColor"][stroke="none"]'),oldMusic:!!tik?.querySelector('ellipse'),telegram:telegram?.querySelector('small')?.textContent};
                  },prefix);
                  check(desktop.navHtml.indexOf('href="'+prefix+'/usernames"')<desktop.navHtml.indexOf('data-nav-menu'),variant+' '+lang+' Nicknames precede Services');
                  check(desktop.headerHeight<90 && desktop.panelPosition==='absolute'&&desktop.panelVisible==='hidden',variant+' '+lang+' desktop panel overlay layout');
                  check(desktop.panelColor==='rgb(11, 11, 13)',variant+' '+lang+' matte black dropdown');
                  check(desktop.tikBrand&&!desktop.oldMusic,variant+' '+lang+' branded TikTok icon');
                  check(desktop.telegram===(lang==='en'?'Telegram username value':'Стоимость никнейма Telegram'),variant+' '+lang+' Telegram value caption');
                  await page.hover('.sz-nav-trigger');
                  await page.waitForFunction(()=>getComputedStyle(document.querySelector('.sz-nav-panel')).visibility==='visible');
                  check(await page.$eval('.sz-nav-panel',el=>getComputedStyle(el).position==='absolute'),variant+' '+lang+' hover opens overlay');
                  await page.mouse.move(4,850);
                  await page.setViewport({width:390,height:844});
                  await page.reload({waitUntil:'domcontentloaded'});
                  await page.click('.sz-header__burger');
                  await new Promise(r=>setTimeout(r,240));
                  const state=await page.evaluate(pref=>{
                    const side=document.querySelector('.sz-side'),aside=side.innerHTML,groups=Array.from(side.querySelectorAll('.sz-side__group-title')).map(x=>x.innerText);
                    const prime=side.querySelector('.sz-side__group--primary');
                    return {open:side.classList.contains('is-open'),background:getComputedStyle(side).backgroundColor,groups,order:prime.innerHTML.indexOf('href="'+pref+'/usernames"')<prime.innerHTML.indexOf('data-side-dropdown'),hasProjects:aside.includes('href="'+pref+'/projects"'),hasArticles:aside.includes('href="'+pref+'/articles"'),hasAbout:aside.includes('href="'+pref+'/about"'),hasFaq:aside.includes('href="'+pref+'/faq"'),hasTelegram:aside.includes('href="'+pref+'/tools/telegram-username-value"'),overflow:document.documentElement.scrollWidth<=innerWidth+2,sideScroll:side.scrollHeight>side.clientHeight};
                  },prefix);
                  check(state.open&&state.order,variant+' '+lang+' burger open and Nicknames first');
                  check(state.background==='rgb(11, 11, 13)',variant+' '+lang+' matte mobile drawer');
                  check(state.groups.some(x=>x.toLowerCase().includes(lang==='en'?'sections':'разделы'))&&state.groups.some(x=>x.toLowerCase().includes(lang==='en'?'information':'информация'))&&state.groups.some(x=>x.toLowerCase().includes('valuation')),variant+' '+lang+' all sidebar categories restored');
                  check(state.hasProjects&&state.hasArticles&&state.hasAbout&&state.hasFaq&&state.hasTelegram,variant+' '+lang+' restored section links');
                  check(state.overflow&&state.sideScroll,variant+' '+lang+' scrollable mobile content without overflow');
                  const dropdowns=await page.$$('.sz-side__dropdown');
                  await (await dropdowns[1].$('summary')).click();
                  check(await dropdowns[1].evaluate(el=>el.open),variant+' '+lang+' Valuation mobile dropdown opens');
                  await page.close();
                }
              }
              console.log('PASS ALL '+checks+' MATTE NAVIGATION AND MOBILE SECTIONS ASSERTIONS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/audit.cjs
