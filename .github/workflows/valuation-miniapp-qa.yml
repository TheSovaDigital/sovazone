name: Valuation AI standalone Mini App browser QA
on:
  push:
    branches:
      - feature/valuation-ai-miniapp
    paths:
      - 'valuation-miniapp/**'
      - '.github/workflows/valuation-miniapp-qa.yml'
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Mini App dependencies
        run: npm install --prefix valuation-miniapp --no-audit --no-fund
      - name: Install Chrome driver
        run: npm --prefix /tmp/valuation-qa install puppeteer-core@24.25.0 --no-save --no-audit --no-fund
      - name: Verify JS syntax
        run: |
          node --check valuation-miniapp/app.js
          node --check valuation-miniapp/api/webhook.js
          node --check valuation-miniapp/api/subscriber-store.js
          node --check valuation-miniapp/api/verify-telegram.js
          node --check valuation-miniapp/api/access.js
          node --check valuation-miniapp/api/setup.js
          node --check valuation-miniapp/scripts/configure-bot.mjs
      - name: Test Telegram webhook security and BotFather configuration
        run: node --test valuation-miniapp/tests/bot-setup.test.mjs valuation-miniapp/tests/configure-bot.test.mjs valuation-miniapp/tests/subscriber-store.test.mjs valuation-miniapp/tests/access.test.mjs
      - name: Run browser integration tests
        env:
          NODE_PATH: /tmp/valuation-qa/node_modules
        run: node valuation-miniapp/tests/browser.cjs
      - name: Test current branded source in Chrome
        env:
          NODE_PATH: /tmp/valuation-qa/node_modules
        run: |
          python3 -m http.server 8124 --directory valuation-miniapp --bind 127.0.0.1 >/tmp/valuation-source-server.log 2>&1 &
          sleep 1
          node valuation-miniapp/tests/branding-browser.cjs
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valuation-miniapp-browser-qa
          path: |
            valuation-qa.json
            valuation-390.png
            valuation-1366.png
            valuation-sovazone-390.png
            valuation-sovazone-1366.png
            valuation-branding-qa.json
          if-no-files-found: ignore
