name: Valuation v4.0 production check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valuation-v40-three-letter-fix.yml'

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check live v4.0 short patterns
        run: |
          node - <<'EOF'
          const endpoint='https://sovazone.vercel.app/api/username-value/';
          const tests=[
            ['aaa',30000,50000],
            ['xxx',30000,50000],
            ['zzz',10000,15000],
            ['qqq',10000,15000],
            ['abc',10000,20000],
            ['qwe',6000,10000],
            ['aba',5000,8000],
            ['baa',4000,7000],
            ['aab',3500,6500],
            ['bqy',1500,2000],
            ['111',50000,50000],
            ['aa',20000,30000]
          ];
          for(const [username,min,max] of tests){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,platform:'instagram',lang:'en'})});
            const data=await r.json();
            console.log(`${username}: engine=${data.engineVersion} price=${data.priceMin}-${data.priceMax} category=${data.categoryCode||data.category||''}`);
            if(!r.ok)throw new Error(`${username}: HTTP ${r.status}`);
            if(data.engineVersion!=='instagram-v4.0')throw new Error(`${username}: expected instagram-v4.0, got ${data.engineVersion}`);
            if(Number(data.priceMin)!==min||Number(data.priceMax)!==max)throw new Error(`${username}: expected ${min}-${max}, got ${data.priceMin}-${data.priceMax}`);
            await new Promise(r=>setTimeout(r,500));
          }
          console.log(`PASS ${tests.length} live Instagram v4.0 short-pattern controls`);
          EOF
