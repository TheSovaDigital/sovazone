name: Valuation v4.0 three-letter fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valuation-v40-three-letter-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply v4.0 short-pattern repair
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/Path('tools\/username-value.html'),/d; /Path('en\/tools\/username-value.html'),/d; s/changed!=8/changed!=6/; s/expected 8 HTML/expected 6 HTML/" .github/scripts/patch_valuation_v40.py
          python .github/scripts/patch_valuation_v40.py

      - name: Validate v4.0 before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check api/username-value.js
          node --check tools/username-value.js
          node .github/scripts/test_username_valuation_v38.mjs
          grep -q "instagram-v4.0" api/username-value.js
          grep -q "threeLetterPatternRange" api/username-value.js
          grep -q "aaa:\[30000,50000\]" .github/scripts/test_username_valuation_v38.mjs
          grep -q "instagram-v4.0" tools/username-value.js
          test "$(grep -R -l '/tools/username-value.js?v=19' tools/*.html en/tools/*.html | wc -l)" -ge 6

      - name: Commit repaired valuation engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SovaDigital"
          git config user.email "thesovaz@gmail.com"
          git add api/username-value.js tools/username-value.js .github/scripts/test_username_valuation_v38.mjs .github/workflows/valuation-regression.yml tools/instagram-username-value.html tools/tiktok-username-value.html tools/telegram-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html en/tools/telegram-username-value.html
          git commit -m "Repair three-letter Instagram valuation in v4.0"
          git push origin HEAD:main
