name: Brand Valuation AI pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-valuation-ai-pages.yml'

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply branding patch
        run: python .github/scripts/brand_valuation_ai_pages.py
      - name: Validate valuation pages
        run: |
          node --check tools/username-value.js
          node --check api/username-value.js
          node --check api/telegram-username-value.js
          node .github/scripts/test_username_valuation_v38.mjs
          node .github/scripts/test_telegram_valuation_v1.mjs
          for f in tools/instagram-username-value.html tools/tiktok-username-value.html tools/telegram-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html en/tools/telegram-username-value.html; do
            grep -q 'SOVAZONE VALUATION AI' "$f"
            grep -q 'username-value.css?v=5' "$f"
          done
      - name: Commit branding alignment
        run: |
          git config user.name 'SovaDigital'
          git config user.email 'thesovaz@gmail.com'
          git add tools/instagram-username-value.html tools/tiktok-username-value.html tools/telegram-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html en/tools/telegram-username-value.html
          git diff --cached --quiet && exit 0
          git commit -m 'Align platform pages with SovaZone Valuation AI'
          git push
