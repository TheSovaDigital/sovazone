name: Telegram v1.1 production review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-production-review-v1.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel deployment
        run: sleep 30
      - name: Check Telegram production estimates
        run: |
          cat > /tmp/review.mjs <<'EOF'
          const endpoint='https://sovazone.vercel.app/api/telegram-username-value';
          const usernames=['qzxvna','hello_','aaaa','work','hello','alex','volk','denis','pavel','pasha','paris','money','cloud','dream','love','monkey','white','brand','trading','adidas'];
          let ok=0;
          for(const username of usernames){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,lang:'en',website:''})});
            const data=await r.json().catch(()=>({}));
            if(!r.ok)throw new Error(`${username}: HTTP ${r.status} ${JSON.stringify(data)}`);
            if(data.engineVersion!=='telegram-v1.1')throw new Error(`${username}: engine ${data.engineVersion}`);
            if(username!=='adidas'&&Number(data.priceMaxTon)>0&&Number(data.priceMax)<=0)throw new Error(`${username}: broken USD conversion ${JSON.stringify(data)}`);
            console.log(JSON.stringify({username,category:data.categoryCode,demand:data.demandScore,ton:[data.priceMinTon,data.priceMaxTon],usd:[data.priceMin,data.priceMax],fx:data.tonUsdRate,fxSource:data.tonUsdSource,liquidity:data.liquidity,special:data.specialCase}));
            ok++;
            await new Promise(r=>setTimeout(r,750));
          }
          console.log(`PASS ${ok}/${usernames.length} Telegram production responses`);
          EOF
          node /tmp/review.mjs
