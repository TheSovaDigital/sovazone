name: Telegram v1.2 final semantic review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-v12-final-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review production semantic spread
        run: |
          cat > /tmp/review.mjs <<'EOF'
          const endpoint='https://sovazone.vercel.app/api/telegram-username-value/';
          const usernames=['king','gold','fast','home','business','crypto','invest','market','finance','tiger','lion','wolf','eagle','denis','nikita','sergey','sasha','london','berlin','yerevan','dubai','pashka','hel_lo','xqzva'];
          let ok=0;
          for(const username of usernames){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,lang:'en',website:''})});
            const data=await r.json().catch(()=>({}));
            if(!r.ok)throw new Error(`${username}: HTTP ${r.status} ${JSON.stringify(data)}`);
            if(data.engineVersion!=='telegram-v1.2')throw new Error(`${username}: engine ${data.engineVersion}`);
            console.log(JSON.stringify({username,category:data.categoryCode,demand:data.demandScore,ton:[data.priceMinTon,data.priceMaxTon],usd:[data.priceMin,data.priceMax],liquidity:data.liquidity,special:data.specialCase}));
            ok++;
            await new Promise(r=>setTimeout(r,850));
          }
          console.log(`PASS ${ok}/${usernames.length} Telegram v1.2 final semantic review`);
          EOF
          node /tmp/review.mjs
