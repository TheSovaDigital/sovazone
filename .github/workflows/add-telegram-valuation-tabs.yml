name: Add Telegram valuation tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-telegram-valuation-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add Telegram tabs and cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[
            Path('tools/instagram-username-value.html'),Path('tools/tiktok-username-value.html'),
            Path('en/tools/instagram-username-value.html'),Path('en/tools/tiktok-username-value.html')
          ]
          for p in files:
            s=p.read_text()
            en=str(p).startswith('en/')
            prefix='/en/tools/' if en else '/tools/'
            if 'telegram-username-value' not in s:
              marker='</div>\n<section class="uv-tool"'
              assert marker in s, p
              tab=f'<a class="uv-tab" href="{prefix}telegram-username-value"><span class="uv-dot"></span>Telegram</a>'
              s=s.replace(marker,tab+'</div>\n<section class="uv-tool"',1)
            s=s.replace('/tools/username-value.js?v=13','/tools/username-value.js?v=14')
            p.write_text(s)
          PY
          node --check api/telegram-username-value.js
          node --check tools/username-value.js
          grep -q 'Telegram' tools/instagram-username-value.html
          grep -q 'Telegram' tools/tiktok-username-value.html
          grep -q 'Telegram' en/tools/instagram-username-value.html
          grep -q 'Telegram' en/tools/tiktok-username-value.html
      - name: Commit page changes
        run: |
          git config user.name "SovaDigital"
          git config user.email "thesovaz@gmail.com"
          git add tools/instagram-username-value.html tools/tiktok-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html
          git commit -m "Add Telegram to valuation platform tabs"
          git push
