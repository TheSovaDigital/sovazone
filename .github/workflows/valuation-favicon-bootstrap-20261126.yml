name: Generate approved Valuation AI favicon family
on:
  push:
    branches:
      - feat/valuation-favicon-package-20261126
    paths:
      - .github/workflows/valuation-favicon-bootstrap-20261126.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Generate exact multi-size favicon assets from approved owl icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path('valuation-miniapp')
          source=base/'assets'/'app-icon.webp'
          img=Image.open(source).convert('RGBA')
          assert img.size==(256,256),f'unexpected approved icon source: {img.size}'
          for name,size in {
              'favicon-16x16.png':16,
              'favicon-32x32.png':32,
              'favicon-48x48.png':48,
              'apple-touch-icon.png':180,
              'android-chrome-192x192.png':192,
              'android-chrome-512x512.png':512,
              'mstile-150x150.png':150
          }.items():
              img.resize((size,size),Image.Resampling.LANCZOS).save(base/name,optimize=True)
          img.save(base/'favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48)])
          assert (base/'favicon.ico').read_bytes().startswith(b'\x00\x00\x01\x00')
          print('Favicon and touch icons generated from the approved image')
          PY
      - name: Commit generated assets to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valuation-miniapp/favicon.ico valuation-miniapp/favicon-16x16.png valuation-miniapp/favicon-32x32.png valuation-miniapp/favicon-48x48.png valuation-miniapp/apple-touch-icon.png valuation-miniapp/android-chrome-192x192.png valuation-miniapp/android-chrome-512x512.png valuation-miniapp/mstile-150x150.png
          git commit -m "assets(valuation): generate owl favicon ICO and PNG family"
          git push origin "HEAD:${GITHUB_REF_NAME}"
