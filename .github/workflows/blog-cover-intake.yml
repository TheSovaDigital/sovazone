name: Blog cover intake
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Existing article slug (lowercase hyphenated)'
        required: true
        type: string
      image_url:
        description: 'Temporary HTTPS URL to the generated WebP image'
        required: true
        type: string
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Download and validate cover
        env:
          SLUG: ${{ inputs.slug }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python3 - <<'PY'
          import os,re,urllib.request,struct,pathlib
          slug=os.environ['SLUG']
          url=os.environ['IMAGE_URL']
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',slug): raise SystemExit('Invalid slug')
          if not url.startswith('https://'): raise SystemExit('HTTPS URL required')
          for p in (f'content/blog/{slug}.md',f'en/content/blog/{slug}.md'):
              if not pathlib.Path(p).is_file(): raise SystemExit('Missing '+p)
          req=urllib.request.Request(url,headers={'User-Agent':'SovaZone-Blog-Cover/1.0'})
          with urllib.request.urlopen(req,timeout=25) as response:
              data=response.read(8*1024*1024+1)
          if len(data)>8*1024*1024 or len(data)<1024: raise SystemExit('Invalid file size')
          if data[:4]!=b'RIFF' or data[8:12]!=b'WEBP': raise SystemExit('Not a WebP image')
          # VP8X: canvas dimensions are encoded as 24-bit little-endian integers.
          if data[12:16]==b'VP8X':
              w=1+int.from_bytes(data[24:27],'little')
              h=1+int.from_bytes(data[27:30],'little')
              if abs(w/h-2)>0.08 or w<1000: raise SystemExit(f'Wrong dimensions: {w}x{h}')
          dest=pathlib.Path('image/blog')/(slug+'.webp')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(data)
          print('Validated cover:',dest,len(data),'bytes')
          PY
      - name: Commit image to source branch
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "image/blog/${SLUG}.webp"
          if git diff --cached --quiet; then echo "Cover unchanged"; exit 0; fi
          git commit -m "blog: add validated cover for ${SLUG}"
          git push origin "HEAD:${{ github.ref_name }}"
