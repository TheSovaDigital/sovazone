name: Prepare bilingual blog post with unique cover
on:
  push:
    branches: ['draft/blog-*', 'editorial/blog-*']
    paths: ['.blog/publish-request.json']
  workflow_dispatch:
    inputs:
      slug:
        description: 'Existing article slug (lowercase hyphenated)'
        required: true
        type: string
      image_url:
        description: 'Temporary HTTPS URL to the generated WebP or PNG image'
        required: true
        type: string
      cover_suffix:
        description: 'Optional cache-busting revision such as v2'
        required: false
        type: string
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install dependencies
        run: python3 -m pip install --quiet pillow beautifulsoup4
      - name: Download and validate cover
        env:
          SLUG: ${{ inputs.slug }}
          IMAGE_URL: ${{ inputs.image_url }}
          COVER_SUFFIX: ${{ inputs.cover_suffix }}
        run: |
          python3 - <<'PY'
          import os,re,urllib.request,pathlib,io,json
          from PIL import Image
          from urllib.parse import urlparse
          if os.environ.get('SLUG'):
              slug=os.environ['SLUG']
              url=os.environ['IMAGE_URL']
              suffix=os.environ.get('COVER_SUFFIX','')
          else:
              request=json.loads(pathlib.Path('.blog/publish-request.json').read_text())
              slug=request['slug']
              url=request['image_url']
              suffix=request.get('cover_suffix','')
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',slug):
              raise SystemExit('Invalid slug')
          if not re.fullmatch(r'(?:v[1-9][0-9]{0,2})?',suffix):
              raise SystemExit('Invalid cover revision')
          parsed=urlparse(url)
          if parsed.scheme!='https' or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit('HTTPS URL required')
          for p in (f'content/blog/{slug}.md',f'en/content/blog/{slug}.md'):
              if not pathlib.Path(p).is_file(): raise SystemExit('Missing '+p)
          req=urllib.request.Request(url,headers={'User-Agent':'SovaZone-Blog-Cover/1.0'})
          with urllib.request.urlopen(req,timeout=40) as response:
              data=response.read(8*1024*1024+1)
          if not 1024<len(data)<=8*1024*1024: raise SystemExit('Invalid source image size')
          with Image.open(io.BytesIO(data)) as img:
              img.verify()
          filename=slug+('-'+suffix if suffix else '')+'.webp'
          dest=pathlib.Path('image/blog')/filename
          dest.parent.mkdir(parents=True,exist_ok=True)
          with Image.open(io.BytesIO(data)) as img:
              w,h=img.size
              if img.format not in ('PNG','WEBP') or abs(w/h-2)>0.04 or w<1000:
                  raise SystemExit(f'Invalid cover: {img.format} {w}x{h}')
              if img.format=='PNG':
                  img.convert('RGB').save(dest,'WEBP',quality=90,method=6)
              else:
                  dest.write_bytes(data)
          with Image.open(dest) as validated:
              if validated.format!='WEBP' or validated.size!=(w,h):
                  raise SystemExit('WebP conversion failed')
              validated.verify()
          pathlib.Path('.blog-publish-slug').write_text(slug)
          pathlib.Path('.blog-publish-suffix').write_text(suffix)
          pathlib.Path('.blog-publish-cover').write_text(filename)
          print('Validated cover:',dest,w,h,dest.stat().st_size,'bytes')
          PY
      - name: Generate RU/EN static pages, sitemaps and feeds
        run: |
          set -euo pipefail
          slug="$(cat .blog-publish-slug)"
          node scripts/publish-blog-bilingual.mjs "$slug" "$(cat .blog-publish-suffix)"
          node scripts/prerender-blog.mjs
          python3 scripts/prepare-seo-release.py
          node scripts/generate-feeds.mjs
      - name: Run SEO and syntax checks
        run: |
          set -euo pipefail
          node scripts/test-static-blog-seo.mjs
          node scripts/test-homepage-preview-schema.mjs
          python3 scripts/site-seo-audit.py
          find . -path ./.git -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
          find scripts -name '*.mjs' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Commit validated release files to review branch
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SLUG="$(cat .blog-publish-slug)"
          COVER_FILE="$(cat .blog-publish-cover)"
          git add "image/blog/${COVER_FILE}" "content/blog/${SLUG}.md" "en/content/blog/${SLUG}.md" "post/${SLUG}.html" "en/post/${SLUG}.html" content/blog/index.json en/content/blog/index.json sitemap-blog.xml en/sitemap.xml feed.xml rss.xml blog-feed.xml articles-feed.xml en/feed.xml en/rss.xml en/blog-feed.xml en/articles-feed.xml
          if git diff --cached --quiet; then echo "Cover unchanged"; exit 0; fi
          git commit -m "blog: add validated cover for ${SLUG}"
          git push origin "HEAD:${{ github.ref_name }}"
