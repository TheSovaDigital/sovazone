name: Prepare bilingual blog post with unique cover
on:
  push:
    branches: ['draft/blog-*', 'editorial/blog-*']
    paths: ['.blog/publish-request.json']
  workflow_dispatch:
    inputs:
      slug:
        description: 'Existing article slug (lowercase hyphenated)'
        required: true
        type: string
      image_url:
        description: 'Temporary HTTPS URL to the generated WebP image'
        required: true
        type: string
permissions:
  contents: write
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install dependencies
        run: python3 -m pip install --quiet pillow beautifulsoup4
      - name: Download and validate cover
        env:
          SLUG: ${{ inputs.slug }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python3 - <<'PY'
          import os,re,urllib.request,struct,pathlib
          if os.environ.get('SLUG'):
              slug=os.environ['SLUG']
              url=os.environ['IMAGE_URL']
          else:
              import json
              request=json.loads(pathlib.Path('.blog/publish-request.json').read_text())
              slug=request['slug']
              url=request['image_url']
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',slug): raise SystemExit('Invalid slug')
          if not url.startswith('https://'): raise SystemExit('HTTPS URL required')
          for p in (f'content/blog/{slug}.md',f'en/content/blog/{slug}.md'):
              if not pathlib.Path(p).is_file(): raise SystemExit('Missing '+p)
          req=urllib.request.Request(url,headers={'User-Agent':'SovaZone-Blog-Cover/1.0'})
          with urllib.request.urlopen(req,timeout=25) as response:
              data=response.read(8*1024*1024+1)
          if len(data)>8*1024*1024 or len(data)<1024: raise SystemExit('Invalid file size')
          if data[:4]!=b'RIFF' or data[8:12]!=b'WEBP': raise SystemExit('Not a WebP image')
          # VP8X: canvas dimensions are encoded as 24-bit little-endian integers.
          if data[12:16]==b'VP8X':
              w=1+int.from_bytes(data[24:27],'little')
              h=1+int.from_bytes(data[27:30],'little')
              if abs(w/h-2)>0.08 or w<1000: raise SystemExit(f'Wrong dimensions: {w}x{h}')
          dest=pathlib.Path('image/blog')/(slug+'.webp')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(data)
          from PIL import Image
          with Image.open(dest) as img:
              img.verify()
          with Image.open(dest) as img:
              w,h=img.size
              if img.format!='WEBP' or w<1000 or abs(w/h-2)>0.04: raise SystemExit('Image dimensions or type invalid')
          pathlib.Path('.blog-publish-slug').write_text(slug)
          print('Validated cover:',dest,len(data),'bytes')
          PY
      - name: Generate RU/EN static pages, sitemaps and feeds
        run: |
          set -euo pipefail
          slug="$(cat .blog-publish-slug)"
          node scripts/publish-blog-bilingual.mjs "$slug"
          node scripts/prerender-blog.mjs
          python3 scripts/prepare-seo-release.py
          node scripts/generate-feeds.mjs
      - name: Run SEO and syntax checks
        run: |
          set -euo pipefail
          node scripts/test-static-blog-seo.mjs
          node scripts/test-homepage-preview-schema.mjs
          python3 scripts/site-seo-audit.py
          find . -path ./.git -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
          find scripts -name '*.mjs' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Commit validated release files to review branch
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SLUG="$(cat .blog-publish-slug)"
          git add "image/blog/${SLUG}.webp" "content/blog/${SLUG}.md" "en/content/blog/${SLUG}.md" "post/${SLUG}.html" "en/post/${SLUG}.html" content/blog/index.json en/content/blog/index.json sitemap-blog.xml en/sitemap.xml feed.xml rss.xml blog-feed.xml articles-feed.xml en/feed.xml en/rss.xml en/blog-feed.xml en/articles-feed.xml
          if git diff --cached --quiet; then echo "Cover unchanged"; exit 0; fi
          git commit -m "blog: add validated cover for ${SLUG}"
          git push origin "HEAD:${{ github.ref_name }}"
