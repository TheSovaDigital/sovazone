name: Valuation API smoke test

on:
  push:
    paths:
      - '.github/workflows/valuation-api-smoke.yml'
      - 'api/**'
      - 'tools/username-value.js'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check v3.1 module syntax and import
        shell: bash
        run: |
          set +e
          echo '=== node version ==='
          node --version
          echo '=== node --check v24 ==='
          node --check api/username-value-v24.js
          echo "check_exit=$?"
          echo '=== dynamic import v24 ==='
          node -e "import('./api/username-value-v24.js').then(m=>console.log('import ok',typeof m.default)).catch(e=>{console.error(e);process.exitCode=1})"
          echo "import_exit=$?"

      - name: Check public API routes
        shell: bash
        run: |
          set +e
          for ROUTE in username-value-v22 username-value-v24 username-value; do
            API="https://sovazone.vercel.app/api/${ROUTE}/"
            echo "=== ${ROUTE} OPTIONS ==="
            curl -sS -D - -o /tmp/options.txt -X OPTIONS "$API" \
              -H 'Origin: https://sovazone.com' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type'
            echo
            cat /tmp/options.txt
            echo
            echo "=== ${ROUTE} POST Instagram ==="
            curl -sS -D - -o /tmp/post.txt -X POST "$API" \
              -H 'Origin: https://sovazone.com' \
              -H 'Content-Type: application/json' \
              --data '{"username":"volk","platform":"instagram","lang":"ru","website":""}'
            echo
            cat /tmp/post.txt
            echo
          done
