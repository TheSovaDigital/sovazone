name: SovaUsername Collector 100k

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sovausername-collector.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sovausername-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      API_URL: https://sovazone-git-main-thesovadigitals-projects.vercel.app/api/telegram-sales-batch-v13
      TARGET_SALES: "100000"
      LIMIT: "30"
      CONCURRENCY: "3"
      MAX_RUN_SECONDS: "18000"
      COLLECTOR_KEY: ${{ secrets.SOVA_COLLECTOR_KEY }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Validate collector secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COLLECTOR_KEY:-}" ]; then
            echo "Missing GitHub Actions secret SOVA_COLLECTOR_KEY"
            exit 1
          fi
          if [ -z "${VERCEL_BYPASS:-}" ]; then
            echo "Missing GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

      - name: Continue collection from Blob checkpoint
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          batch_no=0

          fetch_json() {
            local url="$1"
            local outfile="$2"
            shift 2
            local code
            code=$(curl -sS -L --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
              "$@" -o "$outfile" -w '%{http_code}' "$url")

            if [ "$code" != "200" ]; then
              echo "HTTP ${code} from ${url}"
              head -c 1200 "$outfile" || true
              echo
              return 1
            fi

            if ! jq -e . "$outfile" >/dev/null 2>&1; then
              echo "Expected JSON but received a non-JSON response from ${url}:"
              head -c 1200 "$outfile" || true
              echo
              return 1
            fi
          }

          while true; do
            now=$(date +%s)
            elapsed=$((now - started_at))
            if [ "$elapsed" -ge "$MAX_RUN_SECONDS" ]; then
              echo "Time budget reached after ${elapsed}s. Next scheduled/manual run will resume from Blob checkpoint."
              exit 0
            fi

            status_file=$(mktemp)
            fetch_json "${API_URL}?mode=status" "$status_file"

            sold=$(jq -r '.checkpoint.sold_with_price_total // 0' "$status_file")
            offset=$(jq -r '.checkpoint.next_offset // 0' "$status_file")
            complete=$(jq -r '.checkpoint.complete // false' "$status_file")
            rm -f "$status_file"

            echo "Checkpoint: offset=${offset}, sold=${sold}, complete=${complete}"

            if [ "$complete" = "true" ]; then
              echo "Collection enumeration is complete."
              exit 0
            fi

            if [ "$sold" -ge "$TARGET_SALES" ]; then
              echo "Target reached: ${sold} sales with price (target ${TARGET_SALES})."
              exit 0
            fi

            response_file=$(mktemp)
            fetch_json "${API_URL}?mode=run&limit=${LIMIT}&concurrency=${CONCURRENCY}&retries=1" "$response_file" \
              -H "Authorization: Bearer ${COLLECTOR_KEY}"

            ok=$(jq -r '.ok // false' "$response_file")
            if [ "$ok" != "true" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "Collector returned ok=false"
              exit 1
            fi

            next_offset=$(jq -r '.checkpoint.next_offset // 0' "$response_file")
            new_sold=$(jq -r '.checkpoint.sold_with_price_total // 0' "$response_file")
            fragment_errors=$(jq -r '.batch.fragment_errors // 0' "$response_file")
            complete=$(jq -r '.checkpoint.complete // false' "$response_file")

            if [ "$next_offset" -le "$offset" ] && [ "$complete" != "true" ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "Safety stop: offset did not increase (${offset} -> ${next_offset})."
              exit 1
            fi

            if [ "$fragment_errors" -gt 0 ]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "Safety stop: Fragment errors detected in the latest batch (${fragment_errors})."
              exit 1
            fi

            rm -f "$response_file"
            batch_no=$((batch_no + 1))

            if [ $((batch_no % 25)) -eq 0 ]; then
              echo "Progress: workflow batches=${batch_no}, offset=${next_offset}, sold=${new_sold}"
            fi

            if [ "$complete" = "true" ]; then
              echo "Collection enumeration completed at offset ${next_offset}."
              exit 0
            fi

            if [ "$new_sold" -ge "$TARGET_SALES" ]; then
              echo "Target reached: ${new_sold} sales with price."
              exit 0
            fi

            sleep 1
          done
