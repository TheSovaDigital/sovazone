name: Full SEO and text audit
on:
  push:
    branches: [main,seo-content-audit-release-20261109]
    paths:
      - '*.html'
      - '**/*.html'
      - '*.xml'
      - '**/*.xml'
      - 'content/blog/**'
      - 'en/content/blog/**'
      - 'scripts/site-seo-audit.py'
      - 'middleware.js'
      - '.github/scripts/test_blog_seo_middleware.mjs'
      - '.github/workflows/site-seo-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: HTML audit (all RU and EN pages, sitemap, links, metadata and text)
        run: |
          python3 -m pip install beautifulsoup4 --quiet
          python3 scripts/site-seo-audit.py
      - name: Blog SSR metadata regressions
        run: node .github/scripts/test_blog_seo_middleware.mjs
      - name: JavaScript syntax
        run: |
          find . -path ./.git -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
          find scripts -name '*.mjs' -type f -print0 | xargs -0 -r -n1 node --check
