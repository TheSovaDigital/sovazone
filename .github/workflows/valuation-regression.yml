name: Username valuation regression

# Permanent Instagram/TikTok v4.0 + Telegram v1.2 regression suite.
on:
  push:
    branches: [main]
    paths:
      - 'api/username-value.js'
      - 'api/telegram-username-value.js'
      - 'tools/username-value.js'
      - 'tools/instagram-username-value.html'
      - 'tools/tiktok-username-value.html'
      - 'tools/telegram-username-value.html'
      - 'en/tools/instagram-username-value.html'
      - 'en/tools/tiktok-username-value.html'
      - 'en/tools/telegram-username-value.html'
      - '.github/scripts/test_username_valuation_v38.mjs'
      - '.github/scripts/test_telegram_valuation_v1.mjs'
      - '.github/workflows/valuation-regression.yml'
  workflow_dispatch:

jobs:
  local-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate syntax and import
        run: |
          node --check api/username-value.js
          node --check api/telegram-username-value.js
          node --check tools/username-value.js
          node -e "Promise.all([import('./api/username-value.js'),import('./api/telegram-username-value.js')]).then(([a,b])=>{if(typeof a.default!=='function'||typeof b.default!=='function')process.exit(1);console.log('backend imports OK')}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Run deterministic regression controls
        run: |
          node .github/scripts/test_username_valuation_v38.mjs
          node .github/scripts/test_telegram_valuation_v1.mjs
      - name: Validate routes, cache versions and pages
        run: |
          grep -q "platform==='telegram'?'telegram-v1.2':'instagram-v4.0'" tools/username-value.js
          grep -q "api/telegram-username-value/" tools/username-value.js
          grep -q "api/username-value/" tools/username-value.js
          for f in tools/instagram-username-value.html tools/tiktok-username-value.html tools/telegram-username-value.html en/tools/instagram-username-value.html en/tools/tiktok-username-value.html en/tools/telegram-username-value.html; do
            grep -q 'username-value.js?v=' "$f"
            grep -q 'Telegram' "$f"
          done

  production-sentinel:
    if: github.event_name == 'workflow_dispatch'
    needs: local-regression
    runs-on: ubuntu-latest
    steps:
      - name: Validate production Instagram/TikTok semantic controls
        run: |
          cat > /tmp/sentinel.mjs <<'EOF'
          const endpoint='https://sovazone.vercel.app/api/username-value/';
          const tests=[
            ['volk','instagram',15000,20000],['cat','instagram',20000,30000],['alex','instagram',10000,15000],
            ['pavel','instagram',7000,12000],['pasha','instagram',4000,8000],['orel','instagram',5000,8000],
            ['orlov','instagram',2500,5000],['paris','instagram',3000,5000],['pricheska','instagram',400,800],
            ['hel_lo','instagram',100,300],['vip','instagram',20000,30000],['111','instagram',50000,50000],
            ['555','instagram',10000,15000],['aa','instagram',20000,30000],['qzxvna','instagram',0,0],
            ['aaa','instagram',30000,50000],['volk','tiktok',3000,4000]
          ];
          for(const [username,platform,min,max] of tests){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,platform,lang:'en'})});
            const data=await r.json();
            if(!r.ok)throw new Error(`${username}/${platform}: HTTP ${r.status} ${JSON.stringify(data)}`);
            if(data.engineVersion!=='instagram-v4.0')throw new Error(`${username}/${platform}: engine ${data.engineVersion}`);
            if(Number(data.priceMin)!==min||Number(data.priceMax)!==max)throw new Error(`${username}/${platform}: ${data.priceMin}-${data.priceMax}, expected ${min}-${max}`);
            console.log(`OK ${username}/${platform}: ${data.priceMin}-${data.priceMax}`);
            await new Promise(r=>setTimeout(r,650));
          }
          console.log(`PASS ${tests.length} production controls on instagram-v4.0`);
          EOF
          node /tmp/sentinel.mjs
      - name: Validate production Telegram route
        run: |
          node - <<'EOF'
          const endpoint='https://sovazone.vercel.app/api/telegram-username-value/';
          const tests=['qzxvna','hello_','aaaa','work','hello','adidas'];
          for(const username of tests){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,lang:'en'})});
            const data=await r.json();
            if(!r.ok)throw new Error(`${username}: HTTP ${r.status} ${JSON.stringify(data)}`);
            if(data.engineVersion!=='telegram-v1.2')throw new Error(`${username}: engine ${data.engineVersion}`);
            if(username!=='adidas'&&(!Number.isFinite(Number(data.priceMinTon))||!Number.isFinite(Number(data.priceMaxTon))))throw new Error(`${username}: missing TON range`);
            if(username!=='adidas'&&Number(data.priceMaxTon)>0&&Number(data.priceMax)<=0)throw new Error(`${username}: invalid USD conversion`);
            console.log(`OK Telegram ${username}: ${data.priceMinTon}-${data.priceMaxTon} TON / $${data.priceMin}-${data.priceMax}`);
            await new Promise(r=>setTimeout(r,700));
          }
          console.log(`PASS ${tests.length} Telegram production controls on telegram-v1.2`);
          EOF
