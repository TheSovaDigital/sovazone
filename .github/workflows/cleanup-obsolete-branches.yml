name: Cleanup obsolete branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for branch in             cleanup-api-tests-temp             valuation-og-assets             valuation-og-direct             valuation-og-final             cms/blog/telegram-novosti-2026
          do
            echo "Deleting $branch"
            if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
              git push "$remote" --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
