name: Cleanup obsolete branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in             cleanup-api-tests-temp             valuation-og-assets             valuation-og-direct             valuation-og-final             cms/blog/telegram-novosti-2026
          do
            echo "Deleting $branch"
            git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch" >/dev/null 2>&1 || { echo "Already absent: $branch"; continue; }
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$branch"
          done
