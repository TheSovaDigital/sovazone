name: Final valuation semantic audit

# Final v3.7 runtime pass
on:
  push:
    paths:
      - '.github/workflows/final-valuation-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Run semantic valuation batch
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          const groups = {
            1: [
              'king','money','cloud','gold','dream','hello','fast','love','work','wolf',
              'deer','cat','home','storm','black','sun','blue','green','doctor','lawyer'
            ],
            2: [
              'alex','sasha','alexander','den','denis','denchik','pavel','pasha','pashka','stepa',
              'stepan','stepashka','kolyan','kolya','nikolay','kolyanchik','nastya','anastasia','nastenka','slastenka'
            ],
            3: [
              'orlov','orel','baranov','baran','petrov','smith','miller','brown','johnson','garcia',
              'paris','yerevan','armenia','berlin','dubai','london','tokyo','moscow','rome','monaco'
            ],
            4: [
              'pricheska','pri_cheska','qzxvna','qz_xvna','m4d','h0me','hel_lo','aaaaa','aaabb','aabbb',
              'azaza','abcde','qwert','vip','ceo','usa','bmw','killer','devil','crypto'
            ]
          };
          const list = groups[Number(process.env.SHARD)] || [];
          const endpoint = 'https://sovazone.vercel.app/api/username-value/';
          console.log('username\tcategory\tprice\tquality\tliquidity\tengine\tstatus');
          for (const username of list) {
            let row;
            try {
              const r = await fetch(endpoint, {
                method: 'POST',
                headers: {'content-type':'application/json'},
                body: JSON.stringify({username, platform:'instagram', lang:'en'})
              });
              const text = await r.text();
              let data = {};
              try { data = JSON.parse(text); } catch {}
              if (!r.ok) {
                row = [username,'','','','','',`HTTP_${r.status}:${String(data.error||text).slice(0,120)}`];
              } else {
                const min = Number(data.priceMin||0), max = Number(data.priceMax||0);
                const price = data.openEnded ? `$${min}+` : (min===max ? `~$${min}` : `$${min}-$${max}`);
                row = [username,data.categoryCode||data.category||'',price,data.qualityScore??'',data.liquidity||'',data.engineVersion||'', 'OK'];
              }
            } catch (e) {
              row = [username,'','','','','',`ERR:${e.message}`];
            }
            console.log(row.join('\t'));
            await new Promise(r=>setTimeout(r,650));
          }
          EOF
          node /tmp/audit.mjs
