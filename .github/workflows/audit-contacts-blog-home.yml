name: Verify published Contacts Blog and Valuation homepage
on:
  push:
    branches: [audit-contacts-blog-home-20261109]
    paths: ['.github/workflows/audit-contacts-blog-home.yml']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Chrome driver
        run: |
          node --check script.js
          node --check en/script.js
          which google-chrome
          npm --prefix /tmp/test install puppeteer-core@24.25.0 --no-save --no-audit --no-fund
      - name: Test Contacts and Valuation AI layout at desktop and mobile widths
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          sleep 1
          cat > /tmp/test.cjs <<'JS'
          const puppeteer=require('/tmp/test/node_modules/puppeteer-core');
          const fs=require('fs');
          let tests=0;
          const assert=(good,msg)=>{if(!good)throw new Error('FAIL '+msg);console.log('PASS '+msg);tests++};
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const lang of ['ru','en']){
                const page=await browser.newPage();
                const home='https://sovazone.com/'+(lang==='en'?'en/':'')+'?audit=contacts-blog-20261109';
                const prefix=lang==='en'?'/en':'';
                for(const width of [390,768,1024,1280,1440,1600]){
                  await page.setViewport({width,height:900});
                  await page.goto(home,{waitUntil:'domcontentloaded'});
                  await page.waitForSelector('.sz-valuation-callout--home p',{timeout:10000});
                  const dims=await page.$eval('.sz-valuation-callout--home p',node=>{
                    const range=document.createRange();
                    range.selectNodeContents(node);
                    const rects=Array.from(range.getClientRects());
                    return {lines:rects.length,height:node.getBoundingClientRect().height,pheight:node.getBoundingClientRect().height,rectWidth:node.getBoundingClientRect().width,content:rects[0]?.width,whiteSpace:getComputedStyle(node).whiteSpace,overflow:document.documentElement.scrollWidth>innerWidth+2};
                  });
                  console.log('METRICS',lang,width,JSON.stringify(dims));
                  assert(!dims.overflow,lang+' '+width+'px page has no horizontal overflow');
                  if(width>=1024){
                    assert(dims.lines===1&&dims.whiteSpace==='nowrap',lang+' '+width+'px homepage description in one line');
                    assert(dims.content<=dims.rectWidth+3,lang+' '+width+'px text fits container');
                  }
                  if(width===390){
                    assert(dims.whiteSpace!=='nowrap',lang+' phone permits natural wrap');
                  }
                }
                await page.setViewport({width:1280,height:900});
                await page.goto(home,{waitUntil:'domcontentloaded'});
                await page.waitForSelector('.sz-nav-item--contacts');
                const n=await page.$eval('.sz-nav-item--contacts .sz-nav-panel',p=>({position:getComputedStyle(p).position,links:[...p.querySelectorAll('.sz-nav-card')].map(x=>new URL(x.href).pathname)}));
                assert(n.position==='absolute'&&JSON.stringify(n.links)===JSON.stringify(['contacts','about','guarantees'].map(x=>prefix+'/'+x)),lang+' desktop Contacts three links overlay');
                const blog=await page.$eval('.sz-nav-panel[id^="sz-nav-blog-"]',p=>({links:[...p.querySelectorAll('.sz-nav-card')].map(x=>new URL(x.href).pathname),intro:p.querySelector('.sz-nav-panel__eyebrow')?.textContent}));
                assert(JSON.stringify(blog.links)===JSON.stringify(['blog','articles'].map(x=>prefix+'/'+x)),lang+' desktop Blog contains only Blog and Articles');
                assert(!blog.intro.toLowerCase().includes(lang==='en'?'projects':'проекты'),lang+' Blog eyebrow has no projects');

                await page.hover('.sz-nav-item--contacts .sz-nav-trigger');
                await page.waitForFunction(()=>getComputedStyle(document.querySelector('.sz-nav-item--contacts .sz-nav-panel')).visibility==='visible');
                assert(await page.$eval('.sz-nav-item--contacts .sz-nav-panel',p=>p.getBoundingClientRect().right<=innerWidth+2),lang+' Contacts panel fits viewport');
                await page.setViewport({width:390,height:850});
                await page.reload({waitUntil:'domcontentloaded'});
                await page.click('.sz-header__burger');
                await new Promise(r=>setTimeout(r,220));
                const groups=await page.$$('.sz-side__dropdown');
                assert(groups.length===4,lang+' mobile has four dropdown groups');
                const blogLinks=await groups[2].$$eval('.sz-nav-card',items=>items.map(x=>new URL(x.href).pathname));
                assert(JSON.stringify(blogLinks)===JSON.stringify(['blog','articles'].map(x=>prefix+'/'+x)),lang+' mobile Blog contains only Blog and Articles');
                await (await groups[3].$('summary')).click();
                assert(await groups[3].evaluate(x=>x.open),lang+' mobile Contacts opens');
                const urls=await groups[3].$$eval('.sz-nav-card',a=>a.map(x=>new URL(x.href).pathname));
                assert(JSON.stringify(urls)===JSON.stringify(['contacts','about','guarantees'].map(x=>prefix+'/'+x)),lang+' mobile Contacts has correct links');
                await page.close();
              }
              console.log('PASS ALL '+tests+' HOMEPAGE AND CONTACTS ASSERTIONS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/test.cjs
