<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>SovaUsername Date Repair v13</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0b0f;color:#f4f4f5}*{box-sizing:border-box}body{margin:0;background:#0b0b0f}.wrap{max-width:820px;margin:0 auto;padding:42px 18px}.card{background:#121218;border:1px solid #26262e;border-radius:14px;padding:18px;margin:0 0 16px}h1{margin:0 0 8px;font-size:28px}.sub{color:#a1a1aa;line-height:1.5;margin:0 0 24px}input,button{width:100%;border-radius:10px;border:1px solid #30303a;background:#0d0d12;color:#fff;padding:12px;font:inherit}button{cursor:pointer;font-weight:700;background:linear-gradient(90deg,#833ab4,#e1306c,#f77737);border:0;margin-top:12px}.muted{color:#a1a1aa}.good{color:#86efac}.bad{color:#fca5a5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#0d0d12;border:1px solid #26262e;border-radius:10px;padding:12px}.stat span{display:block;font-size:11px;color:#a1a1aa}.stat b{font-size:22px}.line{margin-top:12px;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;background:#09090c;border:1px solid #24242b;border-radius:10px;padding:14px;max-height:430px;overflow:auto;font-size:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>SovaUsername — восстановление дат v13</h1><p class="sub">Один запуск автоматически проходит все старые batch до текущего collector offset. Основной сбор и его checkpoint не сдвигаются.</p><div class="card"><input id="key" type="password" autocomplete="off" placeholder="SOVA_COLLECTOR_KEY"><button id="go">Восстановить все старые даты</button><div id="state" class="line muted">Готово к запуску.</div><div class="stats"><div class="stat"><span>Repair offset</span><b id="off">—</b></div><div class="stat"><span>Добавлено дат</span><b id="dates">—</b></div><div class="stat"><span>Ошибок</span><b id="errs">—</b></div></div></div><div class="card"><pre id="out">Нажмите кнопку выше.</pre></div></div><script>(()=>{const $=id=>document.getElementById(id),API='/api/telegram-sales-batch-v13';let running=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function key(){return $('key').value.trim()}function show(d){$('out').textContent=JSON.stringify(d,null,2);const r=d?.repair||d?.date_repair;if(r){$('off').textContent=r.next_offset??'—';$('dates').textContent=r.dates_added??0;$('errs').textContent=r.errors??0}}async function status(){const r=await fetch(`${API}?mode=status`,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}async function repair(){const r=await fetch(`${API}?mode=repair_dates&max_batches=2&batch_size=30&concurrency=3`,{cache:'no-store',headers:{Authorization:`Bearer ${key()}`}}),d=await r.json();show(d);if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}$('go').onclick=async()=>{if(running)return;if(!key()){ $('state').className='line bad';$('state').textContent='Сначала вставьте SOVA_COLLECTOR_KEY.';return}running=true;$('go').disabled=true;try{let s=await status(),target=Number(s.checkpoint?.next_offset??0),current=Number(s.date_repair?.next_offset??0),round=0;show(s);while(current<target){round++;$('state').className='line muted';$('state').textContent=`Repair ${round}: offset ${current} → цель ${target}…`;const d=await repair();const next=Number(d.repair?.next_offset??current);if(next<=current)throw new Error(`Repair offset не вырос: ${current} → ${next}`);current=next;await sleep(800);s=await status();target=Number(s.checkpoint?.next_offset??target)}$('state').className='line good';$('state').textContent=`Готово. Все старые batch обработаны до offset ${target}.`;show(s)}catch(e){$('state').className='line bad';$('state').textContent=`Ошибка: ${e.message}`}finally{running=false;$('go').disabled=false}}})();</script></body></html>
